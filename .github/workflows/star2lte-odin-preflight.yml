name: star2lte-odin-preflight

on:
  workflow_dispatch:
    inputs:
      stock_boot_path:
        description: "Repo path to the stock BOOT .lz4 already committed under test-results/"
        required: true
        default: "test-results/memmap-2026-11-06/boot.img.lz4"
        type: string
      boot_partition_bytes:
        description: "BOOT partition size in bytes (TWRP report: 57671680)"
        required: true
        default: "57671680"
        type: string
  push:
    branches: [main]
    paths:
      - "shim/star2lte/**"
      - "tools/star2lte-pack-boot.py"
      - ".github/workflows/star2lte-odin-preflight.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install build and LZ4 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler lz4

      - name: Build STAR2LTE images
        run: sh shim/star2lte/build.sh

      - name: Verify stock BOOT input
        env:
          STOCK_BOOT_PATH: ${{ inputs.stock_boot_path || 'test-results/memmap-2026-11-06/boot.img.lz4' }}
        run: |
          test -f "$STOCK_BOOT_PATH" || {
            echo "::error::Missing $STOCK_BOOT_PATH. Check the stock BOOT upload path in main, then run this workflow again."
            exit 1
          }
          mkdir -p package-out
          lz4 -d -f "$STOCK_BOOT_PATH" package-out/stock-boot.img
          test "$(dd if=package-out/stock-boot.img bs=1 count=8 status=none)" = "ANDROID!" || {
            echo "::error::Input is not a decompressed Android BOOT image"
            exit 1
          }
          sha256sum "$STOCK_BOOT_PATH" package-out/stock-boot.img

      - name: Pack preflight kernel into stock BOOT and make Odin AP TAR
        env:
          PARTITION_BYTES: ${{ inputs.boot_partition_bytes || '57671680' }}
        run: |
          case "$PARTITION_BYTES" in
            ''|*[!0-9]*) echo "::error::BOOT partition size must be an integer"; exit 1 ;;
          esac
          python3 tools/star2lte-pack-boot.py pack \
            package-out/stock-boot.img \
            shim/star2lte/out/preflight.Image \
            package-out/boot.img \
            --chip 9810 --partition-size "$PARTITION_BYTES"
          tar -C package-out -cf package-out/star2lte-preflight-odin.tar boot.img
          test "$(tar -tf package-out/star2lte-preflight-odin.tar)" = "boot.img"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("package-out/boot.img")
          b = p.read_bytes()
          assert b[:8] == b"ANDROID!", "bad Android boot magic"
          print(f"Android BOOT candidate: {len(b)} bytes")
          print(f"Odin TAR: {pathlib.Path('package-out/star2lte-preflight-odin.tar').stat().st_size} bytes")
          PY
          sha256sum package-out/boot.img package-out/star2lte-preflight-odin.tar > package-out/SHA256SUMS.txt
          cat package-out/SHA256SUMS.txt
          printf '\nWARNING: diagnostic preflight only; not XNU. Odin AP only; Re-Partition OFF.\n' > package-out/FLASH-WARNING.txt

      - uses: actions/upload-artifact@v4
        with:
          name: star2lte-preflight-odin
          path: |
            package-out/star2lte-preflight-odin.tar
            package-out/boot.img
            package-out/SHA256SUMS.txt
            package-out/FLASH-WARNING.txt
          if-no-files-found: error
          retention-days: 30
