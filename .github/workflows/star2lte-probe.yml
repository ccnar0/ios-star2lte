name: star2lte-probe

on:
  workflow_dispatch:
  push:
    branches: [main, herolte]
    paths:
      - "shim/star2lte/**"
      - "shim/fdt.c"
      - "shim/fdt.h"
      - ".github/workflows/star2lte-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 toolchain and host-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler

      - name: Build stage-0 probe and memory-map image
        run: sh shim/star2lte/build.sh

      - name: Test FDT memory-map parser on host
        run: |
          dtc -I dts -O dtb shim/star2lte/test_memmap.dts -o shim/star2lte/out/test_memmap.dtb
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            shim/star2lte/host_fdtmem_test.c shim/star2lte/fdtmem.c \
            -o shim/star2lte/out/host_fdtmem_test
          shim/star2lte/out/host_fdtmem_test shim/star2lte/out/test_memmap.dtb

      - name: Inspect generated images
        run: |
          ls -l shim/star2lte/out
          file shim/star2lte/out/probe.Image shim/star2lte/out/memmap.Image
          od -An -tx1 -N64 shim/star2lte/out/probe.Image

      - uses: actions/upload-artifact@v4
        with:
          name: star2lte-probe
          path: |
            shim/star2lte/out/probe.Image
            shim/star2lte/out/memmap.Image
          if-no-files-found: error
          retention-days: 30
