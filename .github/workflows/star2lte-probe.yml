name: star2lte-probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "shim/star2lte/**"
      - "shim/fdt.c"
      - "shim/fdt.h"
      - "tools/mkadt_star2lte.py"
      - ".github/workflows/star2lte-probe.yml"
  push:
    branches: [main, herolte, codex/star2lte-xnu-preflight-test]
    paths:
      - "shim/star2lte/**"
      - "shim/fdt.c"
      - "shim/fdt.h"
      - "tools/mkadt_star2lte.py"
      - ".github/workflows/star2lte-probe.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 toolchain and host-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
      - name: Check STAR2LTE ADT generator syntax
        run: python3 -m py_compile tools/mkadt_star2lte.py
      - name: Generate the STAR2LTE ADT
        run: |
          python3 tools/mkadt_star2lte.py /tmp/star2lte.adt \
            --dram-base 0x92000000 --dram-size 0x1d800000
          test -s /tmp/star2lte.adt
          python3 - /tmp/star2lte.adt <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import mkpayload
          base, size = mkpayload.adt_dram(open(sys.argv[1], "rb").read())
          assert (base, size) == (0x92000000, 0x1d800000), (hex(base), hex(size))
          print(f"ADT dram {base:#x}+{size:#x}")
          PY
      - name: Build stage-0, memory-map, XNU preflight and loader images
        run: sh shim/star2lte/build.sh
      - name: Test FDT memory-map parser on host
        run: |
          dtc -I dts -O dtb shim/star2lte/test_memmap.dts -o shim/star2lte/out/test_memmap.dtb
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer shim/star2lte/host_fdtmem_test.c shim/star2lte/fdtmem.c -o shim/star2lte/out/host_fdtmem_test
          shim/star2lte/out/host_fdtmem_test shim/star2lte/out/test_memmap.dtb
          dtc -I dts -O dtb shim/star2lte/test_star2lte_reserved.dts -o shim/star2lte/out/test_star2lte_reserved.dtb
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer shim/star2lte/host_fdtmem_star2lte_test.c shim/star2lte/fdtmem.c -o shim/star2lte/out/host_fdtmem_star2lte_test
          shim/star2lte/out/host_fdtmem_star2lte_test shim/star2lte/out/test_star2lte_reserved.dtb
      - name: Inspect generated images
        run: |
          ls -l shim/star2lte/out
          file shim/star2lte/out/probe.Image shim/star2lte/out/memmap.Image shim/star2lte/out/preflight.Image shim/star2lte/out/xnu_boot.Image
          od -An -tx1 -N64 shim/star2lte/out/preflight.Image
          od -An -tx1 -N64 shim/star2lte/out/xnu_boot.Image
      - uses: actions/upload-artifact@v4
        with:
          name: star2lte-probe
          path: |
            shim/star2lte/out/probe.Image
            shim/star2lte/out/memmap.Image
            shim/star2lte/out/preflight.Image
            shim/star2lte/out/xnu_boot.Image
          if-no-files-found: error
          retention-days: 30
